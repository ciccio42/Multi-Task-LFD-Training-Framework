debug: False
EXPERT_DATA:    null 
save_path:      null
wandb_log: True 
project_name: null
log_freq: 1
val_freq: 1
print_freq: 1
save_freq: 1
cosine_annealing: False
save_optim:     True
resume:         False
finetune:       False
resume_path:    null
resume_step:    -1
device:         0
exp_name:       -1
epochs:         10
bsize:          30
vsize:          ${bsize} # optionally, set to a different batchsize for validation loader
node_id: 0
num_gpus: 1
num_nodes: 1
optimizer:      null #Adam # RMSProp
task_names: null
dataset_target: 'multi_task_il.datasets.multi_task_datasets.MultiTaskPairedDataset'
# loss multipliers
inv_mul:        0
bc_mul:         0
ce_mul:        0
pnt_mul:        0
rep_muls:
  img_byol:           ${byol.mul_pre}
  attn_byol:          ${byol.mul_pos}
  demo_byol:          ${byol.mul_demo}
  intm_byol:          ${byol.mul_intm}
  simclr_pre:         ${simclr.mul_pre}
  simclr_post:        ${simclr.mul_pos}
  simclr_intm:        ${simclr.mul_intm}
rollout: false
train_cfg:
  batch_size:           ${bsize}
  val_size:             ${vsize}
  lr:                   1e-3 #5e-4
  optimizer:            ${optimizer}
  epochs:               ${epochs}
  log_freq:             ${log_freq}
  save_freq:            ${save_freq}
  print_freq:           ${print_freq}
  val_freq:             ${val_freq}
  inv_loss_mult:        ${inv_mul}
  bc_loss_mult:         ${bc_mul}
  pnt_loss_mult:        ${pnt_mul}
  rep_loss_muls:        ${rep_muls}
  dataset:              ${dataset_cfg}
  sampler:              ${samplers}
  target_update_freq:   5  # used for soft parameter update
  early_stopping: ${early_stopping_cfg}
  weight_decay:  0.05
  lr_schedule: 'ReduceLROnPlateau' # ExponentialDecay # CosineAnnealingWarmupRestarts # CosineAnnealingLR 

# early stopping configurator
early_stopping_cfg:
  patience: 10
  delta: 1e-3

# tasks related
tasks:       ???
single_task: False 
exclude_task: False 
use_all_tasks: False 
set_same_n:   -1 
limit_num_traj: -1
limit_num_demo: -1
defaults:
  - tasks_cfgs:  7_tasks_real

# dataset/loader/samplers
loader_workers:   20
samplers:        
  batch_size:         ${bsize}
  drop_last:          False
  shuffle:            True 
  # Policy 1: At each slot is assigned a RandomSampler
  balancing_policy: 1 # 0, 1, 2 
val_skip:             True # whether to let the samplers skip some **sub**tasks
train_skip:           True

dataset_cfg:
  _target_:         ${dataset_target}
  root_dir:         ${EXPERT_DATA}
  mode:             ???
  tasks_spec:       ${tasks}
  aux_pose:         False # only required for DAML baseline 
  height:           224 # 224 # 200 # 100
  width:            224 # 224 # 360 # 180
  split:            [0.90, 0.10]
  dagger: False
  demo_T:           4
  obs_T:            7
  data_augs:        ${augs}
  non_sequential:   False
  aug_twice:       False
  allow_val_skip:   ${val_skip}
  allow_train_skip: ${train_skip}
  use_strong_augs:  True
  select_random_frames: True
  compute_obj_distribution: False
  agent_name: 'ur5e'
  demo_name: 'panda'
  load_action: false
  load_state: false
  state_spec: [action]
  action_spec: 'action'
  normalize_action: False
  # x, y, z, e_x, e_y, e_z
  normalization_ranges: [[-0.35,  0.35],
                        [-0.35,  0.35],
                        [ 0.60,  1.20],
                        [-3.14,  3.14911766],
                        [-3.14911766, 3.14911766],
                        [-3.14911766,  3.14911766]]
  n_action_bin: 256
  first_frames: False
  only_first_frame: False
  
  task_id: False
  tasks: {}
  n_tasks: 16
  perform_augs: False
  perform_scale_resize: True
  change_command_epoch: False
  load_eef_point: False
  mix_sim_real: False
  num_gpus: ${num_gpus}
  num_nodes: ${num_nodes}

augs:
  old_aug: false
  brightness: [0.6, 1.4] #[0.9, 1.1]
  contrast: [0.7, 1.3] #[0.9, 1.1]
  saturation: [0.7, 1.3] #[0.9, 1.1]
  hue: [-0.05, 0.05] #[0.0, 0.0]
  p: 0.5 
  horizontal_flip_p: 0.5
  affine: True
  affine_p: 0.5
  shift_limit: 0.3
  # rotate_limit/scale_limit were previously hardcoded to 0 in data_aug.py (shift-only "affine",
  # despite the name) - no coverage for camera angle/distance changes between train and test.
  # +/-15deg and +/-10% scale jitter around the fixed camera pose; GT bounding boxes are
  # transformed consistently (same Albumentations ShiftScaleRotate call, not a separate step).
  rotate_limit: 15
  scale_limit: 0.1
  normalize: False
  black_patch_prob: 0.4
  black_patch_params:
    num_patches: 1
    min_size: 5
    max_size: 30
  
  brightness_strong: [0.875, 1.125]
  contrast_strong: [0.5, 1.5]
  saturation_strong: [0.5, 1.5]
  hue_strong: [-0.05, 0.05]
  p_strong: 0.5 
  horizontal_flip_p_strong: 0.5

# model related
policy: ??? # ${cond_policy} # ${cond_target_obj_detector}

cond_target_obj_detector:
  _target_: multi_task_il.models.cond_target_obj_detector.cond_target_obj_detector.CondTargetObjectDetector
  cond_target_obj_detector_cfg: ${cond_target_obj_detector_cfg}

cond_target_obj_detector_cfg:
  height: 224
  width: 224
  demo_T: ${dataset_cfg.demo_T}
  obs_T: ${dataset_cfg.obs_T}
  cond_backbone_name: r2plus1d_18
  agent_backbone_name: resnet18
  cond_video: True
  pretrained: True
  # anc_scales/anc_ratios re-fit from measured gt_bb sizes on the real
  # pick_place data (camera_front, 672x376 native -> rescaled to the actual
  # training resolution height/width=100/180, conv_drop_dim=4, stride ~7).
  # This detector localizes BOTH the target object (cube, ~0.8-2.5 feature
  # units) and the target place/bin (~4.2-5.8 feature units, measured
  # separately from the 4 bin_* regions) -- an earlier version of this grid
  # only covered the cube range and, despite training, never produced a
  # single bin detection across a 40-trajectory eval (no anchor was even
  # close to bin-sized, so no positive training signal ever reached that
  # class). Both size regimes share a similar aspect ratio (~0.5-1.3), so
  # only the scale range needs to span both.
  anc_scales: [0.75, 1.0, 1.5, 2.0, 2.5, 3.5, 4.5, 5.5]
  anc_ratios: [0.5, 0.7, 0.85, 1.0, 1.3]
  dim_H: 14
  dim_W: 14
  n_channels: 256
  conv_drop_dim: 3
  gpu_id: 0
  demo_ff_dim: [128, 64, 32]
  demo_linear_dim: [256, 128] #[512, 256, 128]
  task_embedding_dim: 128
  n_classes: 2
  x_offset: 2.0
  y_offset: 1.5
  # RPN positive-match threshold raised from 0.4: since the model now has a
  # second-stage refinement head, the RPN no longer needs to accept loose
  # (low-IoU) matches as positives just to have a usable final box.
  pos_thresh: 0.5
  neg_thresh: 0.3
  conf_thresh: 0.7
  nms_thresh: 0.5
  # ROI-align sampling resolution (was an effectively-1x1 roi_pool via
  # AvgPool2d(roi_size) collapsing all spatial signal before the FC head)
  roi_size: [7, 7]

actions:
  adim: 7
  sdim: 7
  action_cfg: 6
  n_mixtures: 7
  const_var: False
  sep_var: True

cond_policy:
  _target_: multi_task_il.models.cond_target_obj_detector.policy.CondPolicy
  cond_target_obj_detector_pretrained: True
  cond_target_obj_detector_weights: "/user/frosa/multi_task_lfd/Multi-Task-LFD-Framework/mosaic-baseline-sav-folder/TARGET_OBJ_DETECTOR_SLOT/1Task-Pick-Place-Cond-Target-Obj-Detector-Batch32/"
  cond_target_obj_detector_step: 4050
  action_cfg: ${actions}
  freeze_target_detector: True
  concat_state: True
  concat_bb: True
  mlp_layers: [1024, 512, 256]
  spatial_softmax: False
  gt_bb: False
  n_tasks: [16]
  min_std: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01]