debug: True
EXPEc_DATA:    null 
save_path:      null
wandb_log: False 
project_name: null
log_freq: 1
val_freq: 1
print_freq: 1
save_freq: 1
num_gpus: 1
node_id: 0
cosine_annealing: False
save_optim:     True
resume:         False
resume_path:    ''
resume_step:    -1
device:         0
exp_name:       -1
epochs:         10
bsize:          32
vsize:          ${bsize} # optionally, set to a different batchsize for validation loader
optimizer:      null #Adam # RMSProp
loss: "mse" # "mse" or "cosine"
bb_sequence: 1
action_sequence: 1
task_names: null
rollout: False
dataset_target: 'multi_task_il.datasets.command_encoder.command_encoder_dataset.CommandEncoderFinetuningDataset'

train_cfg:
  batch_size:           ${bsize}
  val_size:             ${vsize}
  lr:                   1e-4
  optimizer:            ${optimizer}
  epochs:               ${epochs}
  log_freq:             ${log_freq}
  save_freq:            ${save_freq}
  print_freq:           ${print_freq}
  val_freq:             ${val_freq}
  inv_loss_mult:        ${inv_mul}
  bc_loss_mult:         ${bc_mul}
  pnt_loss_mult:        ${pnt_mul}
  rep_loss_muls:        ${rep_muls}
  dataset:              ${dataset_cfg}
  sampler:              ${samplers}
  target_update_freq:   5  # used for soft parameter update
  early_stopping: ${early_stopping_cfg}
  weight_decay:  0.00 #0.05
  lr_schedule: null #'ExponentialDecay' #'ReduceLROnPlateau'
  # rate_exponential_decay: 0.1

# early stopping configurator
early_stopping_cfg:
  patience: 10
  delta: 1e-3

# tasks related
tasks:       ???
single_task: False 
exclude_task: False 
use_all_tasks: False 
set_same_n:   2
limit_num_traj: -1
limit_num_demo: -1
defaults:
  - ../tasks_cfgs:  7_tasks
  - dataset_parameters: dataset_parameters

# dataset/loader/samplers
loader_workers:   20
samplers:        
  batch_size:         ${bsize}
  drop_last:          False
  shuffle:            True 
  # Policy 1: At each slot is assigned a RandomSampler
  balancing_policy: 0 # 0, 1, 2 
val_skip:             True # whether to let the samplers skip some **sub**tasks
train_skip:           True

sampler_cfg:
  # _target_: ${sampler_target}
  shuffle: True
      
dataset_cfg:
  _target_: ${dataset_target}
  tasks_spec: ${tasks}
  dataset_samples_spec: ${dataset_parameters}
  mode: 'train'
  jsons_folder: ''
  demo_T: 4
  width: 224 # 180
  height: 224 # 100
  aug_twice: False
  aux_pose: True
  use_strong_augs: False
  data_augs: ${augs}
  black_list: [] # ['sim_ur5e_pick_place_shifted_converted_absolute', 'real_new_ur5e_pick_place_converted_absolute', 'droid_converted_absolute_pose']
  select_random_frames: True

augs:
  old_aug: False
  brightness: [0.6, 1.4] #[0.9, 1.1]
  contrast: [0.7, 1.3] #[0.9, 1.1]
  saturation: [0.7, 1.3] #[0.9, 1.1]
  hue: [-0.05, 0.05] #[0.0, 0.0]
  p: 0.0
  horizontal_flip_p: 0.5
  brightness_strong: [0.875, 1.125]
  contrast_strong: [0.5, 1.5]
  saturation_strong: [0.5, 1.5]
  hue_strong: [-0.05, 0.05]
  p_strong: 0.5 
  horizontal_flip_p_strong: 0.5
  null_bb: True

# model related
policy: ???  # set to any set of configs via command line, e.g. policy='${tosil}'

cond_module:
  _target_: multi_task_il.models.command_encoder.cond_module.CondModule
  height: 100 # not used
  width: 180 # not used
  demo_T: 4
  model_name: 'r2plus1d_18'
  pretrained: True
  cond_video: True
  n_layers: 3
  demo_W: 7
  demo_H: 7
  demo_ff_dim: [128, 64, 32]
  demo_linear_dim: [512, 512, 512] # [] or [512, 256, 128]
  conv_drop_dim: 3