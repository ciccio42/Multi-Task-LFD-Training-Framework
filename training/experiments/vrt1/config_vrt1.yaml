debug: True
EXPERT_DATA:    null 
save_path:      null
wandb_log: True 
project_name: null
log_freq: 1
val_freq: 1
print_freq: 1
save_freq: 1
cosine_annealing: False
save_optim:     True
resume:         False
finetune:       False
resume_path:    'rt1_real_panda-sim_ur5e-sim_ur5e-real_COtraining-Batch48' #'rt1_real_X-all+MS-all_to_MR-UR5_finetuning-lr5e-6-Batch48' #'rt1_real_ur5e-panda-datasets_pre-training-Batch48' # /user/frosa/multi_task_lfd/checkpoint_save_folder/rt1_real_ur5e-panda-datasets_pre-training-Batch48/model_save-30910.pt
resume_step:    17000
device:         0
exp_name:       -1
epochs:         10
bsize:          30
vsize:          ${bsize} # optionally, set to a different batchsize for validation loader
optimizer:      null #Adam # RMSProp
loss: ""
bb_sequence: 1
action_sequence: 1
task_names: null
rollout: False
dataset_target: 'multi_task_il.datasets.vrt1.vrt1_dataset.VRT1_Dataset'
couple_paths_json: ''
# loss multipliers
inv_mul:        0
bc_mul:         0
ce_mul:        0
pnt_mul:        0
rep_muls:
  img_byol:           ${byol.mul_pre}
  attn_byol:          ${byol.mul_pos}
  demo_byol:          ${byol.mul_demo}
  intm_byol:          ${byol.mul_intm}
  simclr_pre:         ${simclr.mul_pre}
  simclr_post:        ${simclr.mul_pos}
  simclr_intm:        ${simclr.mul_intm}

train_cfg:
  batch_size:           ${bsize}
  val_size:             ${vsize}
  lr:                   5e-5 #1e-6 #1e-6 #5e-5 #5e-4 #5e-5 #5e-4 #1e-3 #5e-5 for finetuning
  optimizer:            ${optimizer}
  epochs:               ${epochs}
  log_freq:             ${log_freq}
  save_freq:            ${save_freq}
  print_freq:           ${print_freq}
  val_freq:             ${val_freq}
  inv_loss_mult:        ${inv_mul}
  bc_loss_mult:         ${bc_mul}
  pnt_loss_mult:        ${pnt_mul}
  rep_loss_muls:        ${rep_muls}
  dataset:              ${dataset_cfg}
  sampler:              ${samplers}
  target_update_freq:   5  # used for soft parameter update
  early_stopping: ${early_stopping_cfg}
  weight_decay:  0.05
  lr_schedule: 'ReduceLROnPlateau' # ExponentialDecay

# early stopping configurator
early_stopping_cfg:
  patience: -1
  delta: 1e-3

# tasks related
tasks:       ???
single_task: False 
exclude_task: False 
use_all_tasks: False 
set_same_n:   -1 
limit_num_traj: -1
limit_num_demo: -1
defaults:
  - tasks_cfgs:  tasks
  - finetuning_cfgs: dataset_parameters.yaml

# dataset/loader/samplers
loader_workers:   20
samplers:        
  batch_size:         ${bsize}
  drop_last:          False
  shuffle:            True 
  # Policy 1: At each slot is assigned a RandomSampler
  balancing_policy: 0 # 0, 1, 2 
val_skip:             True # whether to let the samplers skip some **sub**tasks
train_skip:           True

dataset_cfg:
  _target_: ${dataset_target}
  dataset_samples_spec: ${finetuning_cfgs}
  mode: 'train'
  jsons_folder: ${couple_paths_json}
  demo_T: 4
  obs_T: 6
  width: 224
  height: 224
  aug_twice: False
  aux_pose: False
  use_strong_augs: False
  data_augs: ${augs}
  batch_size: ${bsize}
  black_list: [] # ['asu_table_top_converted_absolute_pose', 'berkeley_autolab_ur5_converted_absolute_pose', 'iamlab_cmu_pickup_insert_converted_absolute_pose','taco_play_converted_absolute_pose', 'sim_ur5e_pick_place_shifted_converted_absolute', 'sim_panda_pick_place_converted_absolute']
  select_random_frames: True # the 4 frames: [first, random, random, last]
  convert_action: False # this is because we already converted them
  take_first_frame: False # if True the agent trajectory in the training starts with the first frame
  non_sequential: False
  split_pick_place: False
  state_spec: ('ee_aa' 'gripper_qpos')
  load_eef_point: False
  bbs_T: -1
  perform_augs: True
  perform_scale_resize: True
  agent_name: 'ur5'
  demo_name: 'human_rgb'
  pick_next: False
  normalize_action: False
  max_demo_for_variation: 2
  split: [0.9, 0.1] # (train, val) split


augs:

  old_aug: false
  brightness: [0.9, 1.1]
  contrast: [0.9, 1.1]
  saturation: [0.9, 1.1]
  hue: [0.0, 0.0]
  p: 0.1 
  horizontal_flip_p: 0.1
  
  brightness_strong: [0.875, 1.125]
  contrast_strong: [0.5, 1.5]
  saturation_strong: [0.5, 1.5]
  hue_strong: [-0.05, 0.05]
  p_strong: 0.5 
  horizontal_flip_p_strong: 0.5

  null_bb: True
# model related
policy: ???  # set to any set of configs via command line, e.g. policy='${tosil}'

cond_module_path: ''

cond_module:
  height: 224 # not used
  width: 224 # not used
  demo_T: 4
  model_name: "r2plus1d_18"
  pretrained: True
  cond_video: True
  n_layers: 3
  demo_W: 7
  demo_H: 7
  demo_ff_dim: [128, 64, 32]
  demo_linear_dim: [512, 512, 512]
  conv_drop_dim: 3
  cond_module_model_path: ${cond_module_path}


rt1_video_cond:
  _target_: multi_task_il.models.vrt1.repo.pytorch_robotics_transformer.rt1_video_cond.RT1_video_cond
  ### rt1 params
  input_tensor_space:
    image:
      low: 0.0
      high: 1.0
      shape:
        - 3
        - ${dataset_cfg.height}
        - ${dataset_cfg.width}
      dtype: numpy.float32
    natural_language_embedding:
      low: float("-inf")  # -1.0
      high: float("inf")  # 1.0
      shape: [512]
      dtype: numpy.float32
  output_tensor_space:
    world_vector:
      low_x: -0.25
      low_y: -0.25
      low_z: -0.25
      high_x: 0.25
      high_y: 0.25
      high_z: 0.25
    #### for delta
    rotation_delta:
      low_phi: -6.28
      low_theta: -6.28
      low_psi: -6.28
      high_phi: 6.28
      high_theta: 6.28
      high_psi: 6.28
    ###### END ABSOLUTE SIM DATASET RANGE
    gripper_closedness_action:
      # low: 0.0 # 0.0 chiuso
      # high: 1.0 # 1.0 aperto
      low: -1.0 # -1.0 aperto (nel dataset originale)
      high: 1.0 # 1.0 chiuso
      shape: [1]
      dtype: numpy.float32
  train_step_counter: 0
  vocab_size: 256
  token_embedding_size: 512
  num_layers: 1
  layer_size: 4096
  num_heads: 8
  feed_forward_size: 512
  dropout_rate: 0.1
  time_sequence_length: 6 # 7
  crop_size: 236
  use_token_learner: True
  return_attention_scores: False
  img_height: ${dataset_cfg.height}
  img_width: ${dataset_cfg.width}
  # action_order: Optional[List[str]] = None
  concat_target_obj_embedding: False
  cond_module_cfg: ${cond_module}
  